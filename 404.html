<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* BODY */
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#05070d;
  color:white;
  overflow:hidden;
}

/* CONTAINER */
.container{
  text-align:center;
  padding:20px;
  max-width:600px;
}

/* 404 TEXT */
.container h1{
  font-size:120px;
  color:#00f7ff;
  text-shadow:0 0 20px #00f7ff;
}

/* SUBTEXT */
.container h2{
  font-size:28px;
  margin:10px 0;
}

.container p{
  color:#aaa;
  margin-bottom:20px;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:12px 25px;
  background:linear-gradient(45deg,#00f7ff,#007bff);
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #00f7ff;
}

/* ANIMATED DNA BACKGROUND */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#00f7ff22 1px, transparent 1px);
  background-size:40px 40px;
  animation:moveBg 10s linear infinite;
  z-index:-1;
}

@keyframes moveBg{
  0%{transform:translate(0,0);}
  100%{transform:translate(-50px,-50px);}
}

/* ================= RESPONSIVE ================= */

/* TABLET */
@media(max-width:1024px){
  .container h1{
    font-size:90px;
  }
}

/* MOBILE */
@media(max-width:768px){
  .container h1{
    font-size:70px;
  }
  .container h2{
    font-size:22px;
  }
}

/* SMALL MOBILE */
@media(max-width:480px){
  .container h1{
    font-size:55px;
  }
  .container h2{
    font-size:18px;
  }
  .btn{
    padding:10px 20px;
    font-size:14px;
  }
}

</style>
</head>

<body>

<div class="container">
  <h1>404</h1>
  <h2>Page Not Found</h2>

  <p>
    The page you're looking for might have been removed,
    renamed, or is temporarily unavailable.
  </p>

  <a href="index.html" class="btn">⬅ Back to Home</a>
</div>

</body>
</html>
