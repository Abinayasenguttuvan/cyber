<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Security Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ROOT */
:root{
--cyber-primary:#00ffcc;
--cyber-secondary:#0ea5e9;
--cyber-dark:#020617;
--cyber-card:rgba(255,255,255,0.05);
--cyber-border:rgba(255,255,255,0.12);
--cyber-text:#94a3b8;
}

/* GLOBAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#020617,#000);
overflow:hidden;
color:#fff;
}

/* BACK BUTTON */
.cyber-back{
position:fixed;
top:20px;
left:20px;
display:flex;
align-items:center;
gap:8px;
text-decoration:none;
color:#cbd5e1;
font-size:14px;
padding:8px 14px;
border-radius:8px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
transition:.3s;
}

.cyber-back:hover{
color:var(--cyber-primary);
border-color:var(--cyber-primary);
}

/* GLOW BACKGROUND */
body::before,
body::after{
content:"";
position:absolute;
width:400px;
height:400px;
border-radius:50%;
filter:blur(90px);
}

body::before{
background:#00ffcc33;
top:-100px;
left:-100px;
animation:float 6s infinite alternate;
}

body::after{
background:#0ea5e933;
bottom:-100px;
right:-100px;
animation:float 8s infinite alternate;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(40px)}
}

/* WRAPPER */
.cyber-wrapper{
width:100%;
max-width:420px;
padding:20px;
z-index:2;
}

/* CARD */
.cyber-card{
background:var(--cyber-card);
border:1px solid var(--cyber-border);
backdrop-filter:blur(16px);
border-radius:18px;
padding:35px 30px;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* LOGO */
.cyber-logo{
text-align:center;
margin-bottom:20px;
}

.cyber-logo i{
font-size:30px;
color:var(--cyber-primary);
}

/* TITLE */
.cyber-title{
text-align:center;
font-size:26px;
margin-bottom:5px;
}

.cyber-sub{
text-align:center;
color:var(--cyber-text);
font-size:13px;
margin-bottom:25px;
}

/* INPUT */
.cyber-input{
margin-bottom:18px;
}

.cyber-input label{
font-size:13px;
display:block;
margin-bottom:6px;
}

.cyber-input input,
.cyber-input select{
width:100%;
height:45px;
padding:0 12px;
border-radius:10px;
border:1px solid var(--cyber-border);
background:transparent;
color:#fff;
outline:none;
}

.cyber-input input:focus{
border-color:var(--cyber-primary);
}

/* PASSWORD */
.cyber-pass{
position:relative;
}

.cyber-pass span{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* ERROR */
.cyber-error{
font-size:11px;
color:#ff4d4d;
display:none;
}

/* ROW */
.cyber-row{
display:flex;
justify-content:space-between;
font-size:12px;
margin-bottom:15px;
}

/* BUTTON */
.cyber-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ffcc,#0ea5e9);
color:#000;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.cyber-btn:hover{
transform:translateY(-2px);
box-shadow:0 0 20px #00ffcc66;
}

/* LINK */
.cyber-link{
text-align:center;
margin-top:12px;
font-size:13px;
}

.cyber-link a{
color:var(--cyber-primary);
text-decoration:none;
}

/* DEMO */
.cyber-demo{
margin-top:20px;
padding:15px;
border-radius:12px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.12);
font-size:12px;
}

.cyber-demo h4{
margin-bottom:8px;
color:#00ffcc;
}

/* RESPONSIVE */

/* Tablet */
@media(max-width:768px){
.cyber-card{
padding:28px 22px;
}
}

/* Mobile */
@media(max-width:480px){

.cyber-title{
font-size:22px;
}

.cyber-card{
padding:24px 18px;
}

.cyber-back{
top:10px;
left:10px;
font-size:12px;
padding:6px 10px;
}

}

</style>
</head>

<body>

<a href="index.html" class="cyber-back">
<i class="fa fa-arrow-left"></i> Back
</a>

<div class="cyber-wrapper">

<div class="cyber-card">

<div class="cyber-logo">
<i class="fa-solid fa-shield-halved"></i>
</div>

<h2 class="cyber-title">Secure Login</h2>
<p class="cyber-sub">Access your cybersecurity dashboard</p>

<form id="cyberForm">

<div class="cyber-input">
<label>Access Level</label>
<select id="role">
<option>Admin</option>
<option selected>Security Analyst</option>
<option>User</option>
</select>
</div>

<div class="cyber-input">
<label>Email</label>
<input type="email" id="email">
<p id="emailErr" class="cyber-error">Invalid email</p>
</div>

<div class="cyber-input">
<label>Password</label>
<div class="cyber-pass">
<input type="password" id="password">
<span id="toggle"><i class="fa fa-eye"></i></span>
</div>
<p id="passErr" class="cyber-error">Min 6 characters</p>
</div>

<div class="cyber-row">
<label><input type="checkbox"> Remember</label>
<a href="404.html" style="color:#aaa;">Forgot?</a>
</div>

<button class="cyber-btn">Login Securely</button>

<div class="cyber-link">
New user? <a href="register.html">Create Account</a>
</div>

<div class="cyber-demo">
<h4>Demo Access</h4>
<ul>
<li>Admin: admin@secure.com</li>
<li>Analyst: analyst@secure.com</li>
<li>User: user@secure.com</li>
<li>Password: any (min 6 chars)</li>
</ul>
</div>

</form>

</div>
</div>

<script>

/* PASSWORD TOGGLE */
const pass = document.getElementById("password");

document.getElementById("toggle").onclick = ()=>{
pass.type = pass.type === "password" ? "text" : "password";
};

/* VALIDATION */
const email = document.getElementById("email");
const role = document.getElementById("role");

const emailErr = document.getElementById("emailErr");
const passErr = document.getElementById("passErr");

const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const passPattern=/.{6,}/;

document.getElementById("cyberForm").addEventListener("submit",(e)=>{

e.preventDefault();

let valid=true;

if(!emailPattern.test(email.value)){
emailErr.style.display="block";
valid=false;
}else emailErr.style.display="none";

if(!passPattern.test(pass.value)){
passErr.style.display="block";
valid=false;
}else passErr.style.display="none";

if(!valid) return;

localStorage.setItem("role", role.value);
localStorage.setItem("email", email.value);

/* REDIRECT */
if(role.value==="Admin"){
location.href="admin.html";
}else if(role.value==="Security Analyst"){
location.href="analyst.html";
}else{
location.href="user.html";
}

});

</script>

</body>
</html>
